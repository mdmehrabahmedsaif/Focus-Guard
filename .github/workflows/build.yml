name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      # এখানে gradle-version দেওয়ার দরকার নেই, এটি অটোমেটিক আপনার প্রোজেক্টের ভার্সন নিয়ে নেবে।

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FocusGuard-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
