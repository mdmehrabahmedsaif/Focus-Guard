name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FocusGuard-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Get version info
      id: version
      run: |
        echo "VERSION=v1.0-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
        echo "DATE=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: "FocusGuard ${{ steps.version.outputs.VERSION }}"
        body: |
          ## FocusGuard Release ${{ steps.version.outputs.VERSION }}
          **Build Date:** ${{ steps.version.outputs.DATE }}

          ### What's included in this release:
          - 📝 **Google Docs Blocker:** Blocks Google Docs "From Web" image search to keep you focused (kicks out in 0.01s).
          - 🛡️ **WhatsApp Fix:** Resolved issue where keywords like "channel/update" prevented text selection in chats.
          - 🛡️ **System Core Protection:** Hardened Device Admin and Accessibility protection.
          - 🚀 **Performance:** Optimized sub-0.1s block response for WhatsApp, YouTube, and Instagram.
          - ✅ **Bug Fixes:** Improved node matching logic for better compatibility.

          ### How to install:
          1. Download `app-debug.apk` below
          2. Enable "Install from unknown sources" on your device
          3. Install the APK
          4. Enable the Accessibility Service from the app
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
