name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FocusGuard-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Get version info
      id: version
      run: |
        echo "VERSION=v1.0-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
        echo "DATE=$(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: "FocusGuard ${{ steps.version.outputs.VERSION }}"
        body: |
          ## FocusGuard Release ${{ steps.version.outputs.VERSION }}
          **Build Date:** ${{ steps.version.outputs.DATE }}

          ### What's included in this release:
          - 🎙️ **Google Assistant Blocker:** Prevents opening Google Assistant as a standalone app or as a system overlay.
          - 📝 **Google Docs Blocker (v1.7.0):** Instantly kicks you out to the Google Docs Home screen (file list) upon tapping "From Web".
          - ⚡ **Zero-Lag Typing:** Rewrote the background accessibility service checking logic to eliminate recursive node traversals during typing, providing 100% smooth typing and editing.
          - 🛡️ **WhatsApp & Core Security:** Sub-0.1s instant block response for WhatsApp Channels/Updates, Instagram Reels, YouTube Shorts, Device Admin, and Accessibility Settings.

          ### How to install:
          1. Download `app-debug.apk` below
          2. Enable "Install from unknown sources" on your device
          3. Install the APK
          4. Enable the Accessibility Service from the app
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
